server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      default-filters:
        - AddRequestHeader=X-Gateway-Secret, ${gateway.internal-secret}

      routes:

        - id: ms-security-docs
          uri: lb://MS-SECURITY
          predicates:
            - Path=/auth/v3/api-docs
          filters:
            - RewritePath=/auth/v3/api-docs, /v3/api-docs

        - id: ms-productos-docs
          uri: lb://MS-PRODUCTOS
          predicates:
            - Path=/api/productos/v3/api-docs
          filters:
            - RewritePath=/api/productos/v3/api-docs, /v3/api-docs

        - id: ms-facturacion-docs
          uri: lb://MS-FACTURACION
          predicates:
            - Path=/api/facturas/v3/api-docs
          filters:
            - RewritePath=/api/facturas/v3/api-docs, /v3/api-docs

        - id: ms-usuario-docs
          uri: lb://MS-USUARIO
          predicates:
            - Path=/api/usuario/v3/api-docs
          filters:
            - RewritePath=/api/usuario/v3/api-docs, /v3/api-docs


        - id: ms-security
          uri: lb://MS-SECURITY
          predicates:
            - Path=/auth/**

        - id: ms-productos
          uri: lb://MS-PRODUCTOS
          predicates:
            - Path=/api/productos/**
          filters:
            - AuthenticationFilter

        - id: ms-facturacion
          uri: lb://MS-FACTURACION
          predicates:
            - Path=/api/facturas/**
          filters:
            - AuthenticationFilter

        - id: ms-usuario
          uri: lb://MS-USUARIO
          predicates:
            - Path=/api/usuario/**

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    urls:
      - name: ms-security
        url: /auth/v3/api-docs
      - name: ms-productos
        url: /api/productos/v3/api-docs
      - name: ms-facturacion
        url: /api/facturas/v3/api-docs
      - name: ms-usuario
        url: /api/usuario/v3/api-docs

  enable-native-support: true

  api-docs:
    enabled: true

